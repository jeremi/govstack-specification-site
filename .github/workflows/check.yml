name: Check the shared specification site
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify the generic Building Block example
        uses: ./
        with:
          source: examples/building-block
          output: ${{ runner.temp }}/building-block-site
          base: /building-block/
          unofficial: 'true'
